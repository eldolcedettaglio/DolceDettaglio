<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de pedidos · Dolce Dettaglio</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{font-size:17px}
.top{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.top img{width:58px;height:58px;border-radius:50%;mix-blend-mode:multiply}
.top .script{font-size:34px}
.top .sp{flex:1}
.login{max-width:420px;margin:60px auto;background:#fff;border-radius:22px;padding:26px;box-shadow:0 6px 18px rgba(90,62,43,.1);text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:6px 0 16px}
.kpi{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 3px 10px rgba(90,62,43,.08);border-left:6px solid var(--teal);cursor:pointer;text-align:left}
.kpi b{display:block;font-size:30px;line-height:1}.kpi span{font-size:15px}
.kpi[aria-pressed=true]{outline:2px solid var(--ink)}
.k1{border-color:var(--gold)}.k2{border-color:var(--coral)}.k3{border-color:var(--teal)}.k4{border-color:var(--lilac)}.k5{border-color:#b9a99a}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl th{text-align:left;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:0 12px}
.tbl td{background:#fff;padding:10px 12px;vertical-align:middle}
.tbl tr td:first-child{border-radius:14px 0 0 14px}.tbl tr td:last-child{border-radius:0 14px 14px 0}
.tbl tbody tr{cursor:pointer;box-shadow:0 2px 8px rgba(90,62,43,.07)}
.tbl tbody tr:hover td{background:#fffaf2}
.pill2{display:inline-block;border-radius:99px;padding:2px 10px;font-size:14px;font-weight:700;color:#fff;white-space:nowrap}
.q-Pendiente{background:var(--gold)}.q-Enviado{background:var(--lilac)}.q-Aceptado{background:var(--teal)}.q-Rechazado{background:#b9a99a}
.s{background:#efe6d8;color:var(--ink)}
.oid{font-family:Georgia,serif;font-weight:700;color:var(--coral)}
dialog#det{max-width:min(860px,96vw)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.dgrid{grid-template-columns:1fr}.hide-m{display:none}}
.box{background:#fff;border-radius:16px;padding:14px 16px}
.box h4{margin:0 0 8px;color:var(--teal);font-size:19px}
.it{padding:6px 0;border-bottom:1px dashed var(--line);font-size:16px}
.it:last-child{border-bottom:none}
.money{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.money input{text-align:right}
.totline{display:flex;justify-content:space-between;font-size:22px;font-weight:700;margin-top:10px;border-top:2px solid var(--goldL);padding-top:8px}
.hist{white-space:pre-line;font-size:14px;font-style:italic;max-height:140px;overflow:auto}
.copyl{font-size:14px;word-break:break-all;background:var(--cream);border-radius:10px;padding:6px 8px;margin-top:6px}
.empty{padding:40px;text-align:center;font-style:italic}
.shopsw{color:#fff}.shopsw.on{background:var(--teal)}.shopsw.off{background:#9b8b7c}
.need.soon{color:#b7791f;font-weight:700}.need.late{color:#c0392b;font-weight:700}.need small{font-size:12px}
.pay-ok{color:var(--teal);font-size:13px;font-weight:700}.pay-no{color:#c0392b;font-size:13px;font-weight:700}
.qcalc{font-size:14px;margin-top:8px;line-height:1.35}.qcalc .warn{color:#c0392b;font-weight:700;margin-top:4px}
.tabs{display:flex;gap:8px;margin:4px 0 14px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 18px;font-weight:700;font-size:17px}
.tabs button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.card2{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 3px 10px rgba(90,62,43,.08)}
.card2 h4{margin:0 0 10px;color:var(--teal);font-size:20px}
.days{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px}
.days div{flex:1;background:linear-gradient(180deg,var(--coral),#eea3a0);border-radius:5px 5px 0 0;position:relative;min-height:2px}
.days div span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700}
.dlab{display:flex;justify-content:space-between;font-size:13px;font-style:italic;margin-top:4px}
.hb{display:grid;grid-template-columns:44px 1fr 46px;gap:10px;align-items:center;margin:7px 0;font-size:15px}
.hb img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:var(--cream)}
.hb .tr{background:#f4ece0;border-radius:99px;height:10px;overflow:hidden;margin-top:3px}
.hb .tr i{display:block;height:100%;background:var(--teal);border-radius:99px}
.hb b{font-family:Georgia,serif;color:var(--coral);font-size:13px}
.hb .n{text-align:right;font-weight:700;font-size:18px}
.src{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:16px;text-transform:capitalize}
.src .tr{background:#f4ece0;border-radius:99px;height:12px;overflow:hidden}.src .tr i{display:block;height:100%;background:var(--gold)}
.tip{font-size:14px;font-style:italic;margin-top:8px}

</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="logo.webp" alt=""><span class="script grad">Panel de pedidos</span><span class="sp"></span>
    <button class="btn shopsw" id="shopSw" hidden></button><button class="btn light" id="reload" hidden>↻ Actualizar</button><button class="btn light" id="logout" hidden>Salir</button></div>

  <div id="login" class="login" hidden>
    <h2 class="script" style="font-size:42px;margin:0;color:var(--coral)">Acceso</h2>
    <p>Escribe la clave de administración que pusiste en el Apps Script.</p>
    <form id="lf"><input id="key" type="password" class="search" style="width:100%" placeholder="Clave" autocomplete="current-password">
    <div class="err" id="lerr"></div><button class="btn coral" style="margin-top:10px">Entrar</button></form>
  </div>

  <div class="tabs" id="tabs" hidden><button id="tabO" aria-pressed="true">Pedidos</button><button id="tabS" aria-pressed="false">Estadísticas</button></div>
  <div id="stats" hidden>
    <div class="bar"><select id="per" class="search" style="max-width:220px;flex:none"><option value="7">Últimos 7 días</option><option value="30" selected>Últimos 30 días</option><option value="90">Últimos 90 días</option><option value="365">Último año</option></select></div>
    <div id="sbody"><p class="empty">Cargando estadísticas…</p></div>
  </div>
  <div id="main" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="bar"><input class="search" id="q" type="search" placeholder="Buscar por código, nombre, email o producto…"></div>
    <table class="tbl"><thead><tr><th>Pedido</th><th>Cliente</th><th class="hide-m">Entrega</th><th class="hide-m">Uds.</th><th>Para</th><th>Total</th><th>Presupuesto</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table>
    <div id="none" class="empty" hidden>No hay pedidos en esta vista.</div>
  </div>
</div>

<dialog id="det">
  <button class="x" type="button" data-close>×</button>
  <div class="dbody" id="detBody"></div>
</dialog>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="prices.js"></script>
<script>
const esc = ddEsc;
let KEY = ''; try { KEY = localStorage.getItem('dd_admin') || ''; } catch (e) {}
let ORDERS = [], STATUSES = [], QSTATUSES = [], PSTATUSES = ['Pendiente', 'Pagado (Bizum)', 'Pagado (efectivo)', 'Pagará en efectivo al recoger'], filter = 'activos';
const $ = id => document.getElementById(id);
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2400); }

const FILTERS = [
  ['pendientes', 'Presupuesto por hacer', o => o.quoteStatus === 'Pendiente' && o.status !== 'Cancelado', 'k1'],
  ['esperando', 'Esperando respuesta', o => o.quoteStatus === 'Enviado', 'k4'],
  ['activos', 'En curso', o => o.quoteStatus === 'Aceptado' && !['Recibido', 'Recogido', 'Cancelado'].includes(o.status), 'k2'],
  ['pago', 'Pendientes de pago', o => o.quoteStatus === 'Aceptado' && !/^Pagado/.test(o.payment || '') && o.status !== 'Cancelado', 'k1'],
  ['cerrados', 'Entregados', o => ['Recibido', 'Recogido'].includes(o.status), 'k3'],
  ['todos', 'Todos', o => true, 'k5']
];

async function load(){
  try {
    const r = await ddApi('adminList', { key: KEY });
    SHOP_OPEN = r.open !== false; drawSw(); ORDERS = r.orders; STATUSES = r.statuses; QSTATUSES = r.quoteStatuses; if (r.paymentStatuses) PSTATUSES = r.paymentStatuses;
    try { localStorage.setItem('dd_admin', KEY); } catch (e) {}
    $('login').hidden = true; $('tabs').hidden = false; $('shopSw').hidden = false; if ($('stats').hidden) $('main').hidden = false; $('reload').hidden = false; $('logout').hidden = false;
    if (!ORDERS.some(FILTERS.find(f => f[0] === filter)[2])) filter = ORDERS.some(FILTERS[0][2]) ? 'pendientes' : 'todos';
    draw();
  } catch (e) {
    $('main').hidden = true; $('login').hidden = false; $('lerr').textContent = KEY ? e.message : '';
  }
}
function draw(){
  $('kpis').innerHTML = FILTERS.map(([k, label, fn, cls]) => `<button class="kpi ${cls}" aria-pressed="${k === filter}" data-f="${k}"><b>${ORDERS.filter(fn).length}</b><span>${label}</span></button>`).join('');
  $('kpis').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); });
  const fn = FILTERS.find(f => f[0] === filter)[2];
  const term = $('q').value.trim().toLowerCase();
  const list = ORDERS.filter(fn).filter(o => !term || JSON.stringify([o.id, o.name, o.email, o.phone, o.items]).toLowerCase().includes(term));
  if (filter !== 'todos' && filter !== 'cerrados') list.sort((a, b) => (a.needBy || '9999') < (b.needBy || '9999') ? -1 : (a.needBy || '9999') > (b.needBy || '9999') ? 1 : 0);
  $('rows').innerHTML = list.map(o => `<tr data-id="${esc(o.id)}">
    <td><span class="oid">${esc(o.id)}</span><br><span style="font-size:14px">${new Date(o.date).toLocaleDateString('es-ES')}</span></td>
    <td>${esc(o.name)}<br><span style="font-size:14px">${esc(o.email)}</span></td>
    <td class="hide-m">${/Env/.test(o.delivery) ? 'Envío' : 'Recogida'}</td>
    <td class="hide-m">${o.units}</td>
    <td>${needCell(o)}</td>
    <td><b>${o.total === '' ? '—' : ddMoney(o.total)}</b>${o.quoteStatus === 'Aceptado' ? `<br><span class="pay-${/^Pagado/.test(o.payment || '') ? 'ok' : 'no'}">${esc(o.payment || 'Pendiente')}</span>` : ''}</td>
    <td><span class="pill2 q-${esc(o.quoteStatus)}">${esc(o.quoteStatus)}</span></td>
    <td><span class="pill2 s">${esc(o.status)}</span></td></tr>`).join('');
  $('none').hidden = list.length > 0;
  $('rows').querySelectorAll('tr').forEach(tr => tr.onclick = () => openDet(tr.dataset.id));
}
function needCell(o){
  if (!o.needBy) return '<span style="color:#b9a99a">—</span>';
  const d = new Date(o.needBy + 'T12:00:00'), days = Math.ceil((d - new Date()) / 864e5);
  const done = ['Enviado', 'Recibido', 'Entregado en el local', 'Recogido', 'Cancelado'].includes(o.status);
  const cls = done ? '' : days < 0 ? 'late' : days <= 3 ? 'soon' : '';
  return `<span class="need ${cls}">${d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}${!done && days <= 3 ? '<br><small>' + (days < 0 ? 'pasada' : days === 0 ? 'hoy' : 'en ' + days + ' d') + '</small>' : ''}</span>`;
}
function openDet(id){
  const o = ORDERS.find(x => x.id === id); if (!o) return;
  const envio = /Env/.test(o.delivery);
  $('detBody').innerHTML = `
    <h3 style="margin:0">Pedido <span class="oid">${esc(o.id)}</span> · <span class="pill2 q-${esc(o.quoteStatus)}">Presupuesto: ${esc(o.quoteStatus)}</span></h3>
    <div style="margin:4px 0 14px;font-size:16px">${esc(o.name)} · <a href="mailto:${esc(o.email)}">${esc(o.email)}</a>${o.phone ? ' · <a href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a>' : ''}</div>
    <div class="dgrid">
      <div>
        <div class="box"><h4>Productos (${o.units} uds.)</h4>
          ${(o.items || []).map(it => `<div class="it"><b>${it.qty} ×</b> <span class="oid">${esc(it.code)}</span> ${esc(it.name)}<br><span style="font-size:15px">${esc(it.size)}${it.names ? ' · <b>Nombres:</b> ' + esc(it.names) : ''}</span></div>`).join('')}
          ${o.notes ? `<p style="font-style:italic;margin:8px 0 0">“${esc(o.notes)}”</p>` : ''}
        </div>
        <div class="box" style="margin-top:12px"><h4>Entrega</h4><b>${esc(o.delivery)}</b>${o.address ? '<br>' + esc(o.address) : ''}${o.needBy ? '<br><b>Lo necesita para:</b> ' + needCell(o) : ''}</div>
        <div class="box" style="margin-top:12px"><h4>Historial</h4><div class="hist">${esc((o.history || []).join('\n'))}</div>
          <div class="copyl">Enlace del cliente: <a href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.link)}</a></div></div>
      </div>
      <div>
        <div class="box"><h4>Presupuesto</h4>
          <div class="money">
            <label class="f">Productos (€)<input id="mP" inputmode="decimal" value="${o.products === '' ? '' : o.products}"></label>
            <label class="f">Envío (€)<input id="mS" inputmode="decimal" value="${o.shipping === '' ? '' : o.shipping}" ${envio ? '' : 'placeholder="0"'}></label>
            <label class="f">Descuento (€)<input id="mD" inputmode="decimal" value="${o.discount === '' ? '' : o.discount}"></label>
          </div>
          ${envio ? '' : '<div style="font-size:14px;font-style:italic">Recogida en el local: normalmente sin envío.</div>'}
          <button class="btn light" type="button" id="autoQ" style="margin-top:8px">⚡ Calcular con las tarifas</button>
          <div class="qcalc" id="qCalc"></div>
          <div class="totline"><span>Total</span><span id="mT"></span></div>
          <label class="f">Nota para el cliente (opcional)<input id="mN" maxlength="1000" value="${esc(o.quoteNote || '')}" placeholder="Ej.: plazo de entrega, forma de pago…"></label>
          <div class="dact"><button class="btn coral" id="sendQ">${o.quoteStatus === 'Pendiente' ? 'Enviar presupuesto' : 'Reenviar presupuesto'}</button><button class="btn light" id="saveQ">Solo guardar</button></div>
          <label class="f" style="margin-top:10px">Estado del presupuesto (manual)<select id="mQ">${QSTATUSES.map(s => `<option ${s === o.quoteStatus ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
        </div>
        ${o.quoteStatus === 'Aceptado' ? `<div class="box" style="margin-top:12px"><h4>Pago</h4><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="mPay" class="search" style="flex:1;min-width:160px">${PSTATUSES.map(s => `<option ${s === (o.payment || 'Pendiente') ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select><button class="btn teal" id="savePay">Guardar pago</button></div></div>` : ''}
        <div class="box" style="margin-top:12px"><h4>Estado del pedido</h4>
          <select id="mSt" class="search" style="width:100%">${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
          <label class="chk"><input type="checkbox" id="mNotify" checked> Avisar al cliente por email</label>
          <div class="dact"><button class="btn teal" id="saveSt">Actualizar estado</button></div>
          <div style="font-size:14px;font-style:italic;margin-top:6px">${envio ? 'Envío: Sin iniciar → Iniciado → Terminado → Enviado → Recibido' : 'Recogida: Sin iniciar → Iniciado → Terminado → Entregado en el local → Recogido'}</div>
        </div>
      </div>
    </div>`;
  const calc = () => { const n = id => parseFloat(($(id).value || '0').replace(',', '.')) || 0; $('mT').textContent = ddMoney(n('mP') + n('mS') - n('mD')); };
  ['mP', 'mS', 'mD'].forEach(i => $(i).oninput = calc);
  const auto = () => {
    const q = ddQuote(o.items || []);
    $('mP').value = q.products ? String(q.products).replace('.', ',') : '';
    $('mD').value = q.discount ? String(q.discount).replace('.', ',') : '';
    $('qCalc').innerHTML = q.lines.map(l => `<div>${l.qty} × ${esc(l.code)}: ${l.unit === null ? '<b>a medida — pon tú el precio</b>' : ddMoney(l.unit) + (l.extra ? ' + ' + l.extraNames + ' nombre(s) extra' : '') + ' = ' + ddMoney(l.subtotal) + (l.rate ? ' (−' + Math.round(l.rate * 100) + ' %)' : '')}</div>`).join('') +
      (q.custom ? '<div class="warn">Hay artículos a medida: suma su precio en «Productos».</div>' : '') + (/Env/.test(o.delivery) && !$('mS').value ? '<div class="warn">Es un envío: añade el importe del envío.</div>' : '');
    calc();
  };
  $('autoQ').onclick = auto;
  if (o.products === '' && o.quoteStatus === 'Pendiente') auto(); else calc();
  if ($('savePay')) $('savePay').onclick = () => save(o.id, { payment: $('mPay').value }, {}, 'Pago actualizado ✓');
  const money = () => ({ products: $('mP').value, shipping: $('mS').value, discount: $('mD').value, note: $('mN').value });
  $('sendQ').onclick = () => save(o.id, money(), { sendQuote: true }, 'Presupuesto enviado al cliente ✓');
  $('saveQ').onclick = () => save(o.id, Object.assign(money(), { quoteStatus: $('mQ').value }), {}, 'Guardado ✓');
  $('saveSt').onclick = () => save(o.id, { status: $('mSt').value }, { notify: $('mNotify').checked }, 'Estado actualizado ✓');
  $('det').showModal();
}
async function save(id, fields, extra, okMsg){
  const btns = $('detBody').querySelectorAll('.btn'); btns.forEach(b => b.disabled = true);
  try {
    const r = await ddApi('adminUpdate', Object.assign({ key: KEY, id, fields }, extra));
    const i = ORDERS.findIndex(x => x.id === id); ORDERS[i] = r.order;
    toast(okMsg); draw(); openDet(id);
  } catch (e) { toast(e.message); btns.forEach(b => b.disabled = false); }
}
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
$('lf').onsubmit = e => { e.preventDefault(); KEY = $('key').value.trim(); $('lerr').textContent = 'Comprobando…'; load(); };
$('logout').onclick = () => { KEY = ''; try { localStorage.removeItem('dd_admin'); } catch (e) {} location.reload(); };
$('reload').onclick = () => load().then(() => toast('Actualizado'));
$('q').oninput = draw;
let SHOP_OPEN = true, swArmed = false;
function drawSw(){ const b = $('shopSw'); b.className = 'btn shopsw ' + (SHOP_OPEN ? 'on' : 'off'); b.innerHTML = SHOP_OPEN ? '● Pedidos abiertos' : '● Pedidos cerrados'; b.title = SHOP_OPEN ? 'Pulsa para cerrar los pedidos' : 'Pulsa para abrir los pedidos'; }
$('shopSw').onclick = async () => {
  if (!swArmed) { swArmed = true; $('shopSw').innerHTML = SHOP_OPEN ? '¿Cerrar pedidos? Pulsa otra vez' : '¿Abrir pedidos? Pulsa otra vez'; setTimeout(() => { if (swArmed) { swArmed = false; drawSw(); } }, 4000); return; }
  swArmed = false; $('shopSw').disabled = true;
  try { const r = await ddApi('adminSetOpen', { key: KEY, open: !SHOP_OPEN }); SHOP_OPEN = r.open; toast(SHOP_OPEN ? 'Tienda abierta: ya se pueden hacer pedidos' : 'Pedidos cerrados: el catálogo sigue visible'); }
  catch (e) { toast(e.message); }
  $('shopSw').disabled = false; drawSw();
};

/* estadísticas */
let imgsLoaded = false;
function loadImgs(){ return new Promise(res => { if (imgsLoaded) return res(); const s = document.createElement('script'); s.src = 'images.js'; s.onload = () => { imgsLoaded = true; res(); }; s.onerror = () => res(); document.body.appendChild(s); }); }
function thumb(code){ if (/^F\d\d$/.test(code)) return 'fav/' + code + '.webp'; return (window.IMG || {})[String(code).replace('#', '')] || 'logo.webp'; }
function showTab(which){
  $('tabO').setAttribute('aria-pressed', which === 'o'); $('tabS').setAttribute('aria-pressed', which === 's');
  $('main').hidden = which !== 'o'; $('stats').hidden = which !== 's';
  if (which === 's') loadStats();
}
async function loadStats(){
  $('sbody').innerHTML = '<p class="empty">Cargando estadísticas…</p>';
  try {
    const [r] = await Promise.all([ddApi('adminStats', { key: KEY, days: $('per').value }), loadImgs()]);
    drawStats(r.stats);
  } catch (e) { $('sbody').innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}
function list(arr, empty){
  if (!arr.length) return `<p class="tip">${empty}</p>`;
  const max = arr[0].n || 1;
  return arr.slice(0, 10).map(x => `<div class="hb"><img src="${thumb(x.code)}" alt=""><div><b>${esc(x.code)}</b> ${esc(x.name)}<div class="tr"><i style="width:${Math.round(x.n / max * 100)}%"></i></div></div><div class="n">${x.n}</div></div>`).join('');
}
function drawStats(s){
  const n = Math.min(s.days, 30);
  const days = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5); days.push(d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Madrid' })); }
  const vals = days.map(d => s.perDay[d] || 0); const mx = Math.max(1, ...vals);
  const srcs = Object.entries(s.sources).sort((a, b) => b[1] - a[1]); const smx = srcs.length ? srcs[0][1] : 1;
  const conv = s.visitors ? (s.orders / s.visitors * 100) : 0;
  $('sbody').innerHTML = `
    <div class="kpis">
      <div class="kpi k3"><b>${s.visits}</b><span>Visitas</span></div>
      <div class="kpi k4"><b>${s.visitors}</b><span>Visitantes distintos</span></div>
      <div class="kpi k1"><b>${s.today}</b><span>Visitas hoy</span></div>
      <div class="kpi k2"><b>${s.orders}</b><span>Pedidos</span></div>
      <div class="kpi k5"><b>${conv.toFixed(1).replace('.', ',')} %</b><span>Visitantes que piden</span></div>
    </div>
    <div class="sgrid">
      <div class="card2" style="grid-column:1/-1"><h4>Visitas por día${s.days > 30 ? ' (últimos 30)' : ''}</h4>
        <div class="days">${vals.map((v, i) => `<div style="height:${Math.round(v / mx * 100)}%" title="${days[i]}: ${v}">${v ? '<span>' + v + '</span>' : ''}</div>`).join('')}</div>
        <div class="dlab"><span>${new Date(days[0]).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}</span><span>hoy</span></div></div>
      <div class="card2"><h4>Más vistos</h4>${list(s.viewed, 'Aún no hay productos vistos.')}</div>
      <div class="card2"><h4>Más añadidos a «Mi pedido»</h4>${list(s.added, 'Aún nadie ha añadido productos.')}</div>
      <div class="card2"><h4>Más pedidos (unidades)</h4>${list(s.ordered, 'Aún no hay pedidos en este periodo.')}</div>
      <div class="card2"><h4>De dónde llegan</h4>${srcs.length ? srcs.map(([k, v]) => `<div class="src"><span>${esc(k)}</span><div class="tr"><i style="width:${Math.round(v / smx * 100)}%"></i></div><b>${v}</b></div>`).join('') : '<p class="tip">Aún no hay visitas.</p>'}
        <p class="tip">Consejo: en el sticker de Instagram usa tu dirección terminada en <b>?src=instagram</b> (y <b>?src=whatsapp</b> al compartir por WhatsApp) para que el origen se cuente bien.</p></div>
    </div>`;
}
$('tabO').onclick = () => showTab('o'); $('tabS').onclick = () => showTab('s'); $('per').onchange = loadStats;

if (!ddReady()) { $('login').hidden = false; $('lerr').textContent = 'Falta pegar la URL del Apps Script en config.js.'; }
else if (KEY) load(); else $('login').hidden = false;
</script>
</body>
</html>
